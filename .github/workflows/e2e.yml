# Build once, then run every local E2E test class across four isolated Linux workers.
# The optional remote workflow owns SSH tests and its matching remote helper.
# The final e2e check publishes a candidate only after every shard passes; docs-only changes skip the app build and tests.
name: E2E

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build E2E app
    outputs:
      code: ${{ steps.changes.outputs.code }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The same values as the build job of linux-release.yml. A difference makes sccache miss and rebuild everything.
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_FAST_DEBUG: "0"
      RUSTFLAGS: "-C symbol-mangling-version=v0 --cfg tokio_unstable -C link-arg=-fuse-ld=mold"
      CEF_PATH: /home/runner/cef
      CC: clang
      CXX: clang++
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is the base, which is enough to list the changed files.
          fetch-depth: 2

      - name: Test updater release metadata
        run: python3 script/test-cod-update-manifest.py

      - name: Check the app icons
        run: sha256sum --check --strict --quiet script/cod-app-icons.sha256

      - name: Detect code changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Decision: $EVENT_NAME event, building and running the end-to-end tests"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "Decision: cannot list the changed files, building and running the end-to-end tests"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          printf '  %s\n' $files
          code=false
          first=
          for file in $files; do
            case $file in
              *.md | docs/* | LICENSE*) ;;
              *) code=true; first=$file; break ;;
            esac
          done
          if [ -z "$files" ]; then
            code=true
            first="(no changed files listed)"
          fi
          if [ "$code" = true ]; then
            echo "Decision: code change found ($first), building and running the end-to-end tests"
          else
            echo "Decision: docs-only change (*.md, docs/**, LICENSE*), skipping the build and the tests"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # One source of truth for the CEF version: the release workflow.
      - name: Read the CEF version
        if: steps.changes.outputs.code == 'true'
        run: |
          version=$(sed -n 's/^ *CEF_VERSION: *//p' .github/workflows/linux-release.yml | head -n 1)
          test -n "$version"
          echo "CEF_VERSION=$version" >> "$GITHUB_ENV"
          echo "CEF $version"

      # The build packages of linux-release.yml, then what the tests need at run time: the browser runtime libraries (as in check-preview.yml), sway as the headless compositor, grim for screenshots, mesa-vulkan-drivers for software Vulkan, dbus for dbus-run-session.
      - name: Install Linux dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          # Azure's slow mirror can trickle for minutes without timing out (actions/runner-images#14823).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^https\?://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang lld llvm libstdc++-14-dev \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev libssl-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev mold \
            libnss3 libnspr4 libasound2t64 libatspi2.0-0t64 libcups2t64 libdrm2 libgbm1 libgl1-mesa-dri mesa-vulkan-drivers \
            libxkbcommon0 libxkbcommon-x11-0 libpango-1.0-0 libxcomposite1 libxdamage1 libxrandr2 \
            libwebkit2gtk-4.1-0 libfontconfig1 xz-utils util-linux \
            sway grim dbus

      - name: Install Rust toolchain
        if: steps.changes.outputs.code == 'true'
        run: |
          rustup toolchain install || rustup show
          rustc --version
          cargo --version

      - name: Set up sccache
        if: steps.changes.outputs.code == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Restore the cargo registry cache
        if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2.8.0
        with:
          key: release-fast
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Restore the CEF download
        if: steps.changes.outputs.code == 'true'
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-linux-x86_64

      # The same command as in script/e2e, with the same environment as the release build.
      # Pull requests from this repository write too: their entries are scoped to the pull
      # request, so its next run hits the Cod crates it changed instead of missing the same
      # ~120 units on every run (with READ_ONLY each miss was also counted as a write error).
      # Pull requests from forks stay read-only.
      - name: Build
        if: steps.changes.outputs.code == 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'READ_WRITE' || 'READ_ONLY' }}
          RUSTC_WRAPPER: sccache
          CARGO_BUILD_JOBS: "8"
        run: |
          echo "build started at $(date -u '+%H:%M:%S')"
          sccache --zero-stats
          cargo build --locked --profile release-fast -p zed -p cod_browser -p codctl
          sccache --show-stats
          echo "build finished at $(date -u '+%H:%M:%S')"

      - name: Save the CEF download
        if: steps.changes.outputs.code == 'true' && github.ref == 'refs/heads/master' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ env.CEF_VERSION }}-linux-x86_64

      - name: Package the shared app and browser runtime
        if: steps.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          mkdir -p e2e-shared/bin e2e-shared/cef/locales
          cp target/release-fast/zed target/release-fast/cod-browser target/release-fast/codctl e2e-shared/bin/
          strip e2e-shared/bin/zed e2e-shared/bin/cod-browser e2e-shared/bin/codctl
          cef_directory="$CEF_PATH/$CEF_VERSION/cef_linux_x86_64"
          shopt -s nullglob
          runtime_files=("$cef_directory"/*.so "$cef_directory"/*.so.* "$cef_directory"/*.bin "$cef_directory"/*.dat "$cef_directory"/*.pak "$cef_directory"/*.json)
          cp "${runtime_files[@]}" e2e-shared/cef/
          cp "$cef_directory/locales/en-US.pak" e2e-shared/cef/locales/
          test -f e2e-shared/cef/libcef.so
          test -f e2e-shared/cef/icudtl.dat
          tar -C e2e-shared -cf - . | gzip -1 > e2e-shared.tar.gz

      - name: Upload the shared app and browser runtime
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shared
          path: e2e-shared.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  tests:
    name: E2E shard ${{ matrix.shard }}
    needs: build
    if: needs.build.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          # Azure's slow mirror can trickle for minutes without timing out (actions/runner-images#14823).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^https\?://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libasound2t64 libatspi2.0-0t64 libcups2t64 libdrm2 libgbm1 libgl1-mesa-dri mesa-vulkan-drivers \
            libxkbcommon0 libxkbcommon-x11-0 libpango-1.0-0 libxcomposite1 libxdamage1 libxrandr2 libx11-xcb1 \
            libwebkit2gtk-4.1-0 libfontconfig1 libvulkan1 libva2 libxdo3 xz-utils util-linux sway grim dbus

      - name: Download the shared app and browser runtime
        uses: actions/download-artifact@v4
        with:
          name: e2e-shared

      - name: Unpack the shared app and browser runtime
        run: |
          mkdir -p e2e-shared
          tar -xzf e2e-shared.tar.gz -C e2e-shared
          chmod +x e2e-shared/bin/zed e2e-shared/bin/cod-browser e2e-shared/bin/codctl

      - name: Run end-to-end tests
        env:
          COD_E2E_BIN: ${{ github.workspace }}/e2e-shared/bin/zed
          COD_CEF_DIR: ${{ github.workspace }}/e2e-shared/cef
          COD_E2E_SHARD_INDEX: ${{ matrix.shard }}
          COD_E2E_SHARD_COUNT: "4"
          COD_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e-artifacts/shard-${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p target/e2e-artifacts
          script/e2e 2>&1 | tee target/e2e-artifacts/console.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.event.pull_request.head.sha || github.sha }}-shard-${{ matrix.shard }}
          path: target/e2e-artifacts
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: e2e
    needs: [build, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a successful build and every test shard
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CODE_CHANGED: ${{ needs.build.outputs.code }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::The E2E build failed or was cancelled ($BUILD_RESULT)"
            exit 1
          fi
          if [ "$CODE_CHANGED" = true ] && [ "$TEST_RESULT" != success ]; then
            echo "::error::An E2E shard failed or was cancelled ($TEST_RESULT)"
            exit 1
          fi

      - name: Check out
        if: needs.build.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the CEF version
        if: needs.build.outputs.code == 'true'
        run: |
          version=$(sed -n 's/^ *CEF_VERSION: *//p' .github/workflows/linux-release.yml | head -n 1)
          test -n "$version"
          echo "CEF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the tested app
        if: needs.build.outputs.code == 'true'
        uses: actions/download-artifact@v4
        with:
          name: e2e-shared

      - name: Unpack the tested app
        if: needs.build.outputs.code == 'true'
        run: |
          mkdir -p e2e-shared
          tar -xzf e2e-shared.tar.gz -C e2e-shared ./bin
          chmod +x e2e-shared/bin/zed e2e-shared/bin/cod-browser e2e-shared/bin/codctl

      # Reuse this successful build for downloaded-package QA without publishing a release.
      # Packaging matches linux-release.yml; the existing CEF asset is read, never modified.
      - name: Package the tested Linux candidate
        if: needs.build.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="cod-cef-$CEF_VERSION-linux-x86_64.tar.xz"
          mkdir -p candidate-artifacts/cef-asset candidate-package/cod
          gh release download "cef-$CEF_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset.sha256" --dir candidate-artifacts/cef-asset
          checksum=$(cat "candidate-artifacts/cef-asset/$asset.sha256")
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          cp e2e-shared/bin/zed candidate-package/cod/cod
          cp e2e-shared/bin/cod-browser candidate-package/cod/cod-browser
          cp e2e-shared/bin/codctl candidate-package/cod/codctl
          strip candidate-package/cod/cod candidate-package/cod/cod-browser candidate-package/cod/codctl
          cp script/cod-xwayland.sh script/cod-wayland.sh LICENSE-GPL LICENSE-APACHE README.md candidate-package/cod/
          script/cod-linux-desktop-files candidate-package/cod
          printf 'version=%s\nurl=%s/%s/releases/download/cef-%s/%s\nsha256=%s\n' \
            "$CEF_VERSION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CEF_VERSION" "$asset" "$checksum" \
            > candidate-package/cod/cef-manifest
          git rev-parse HEAD > candidate-package/cod/cod-commit.txt
          git rev-parse 'HEAD^{tree}' > candidate-package/cod/cod-tree.txt
          tar -C candidate-package -cf - cod | xz -6 -T0 > candidate-artifacts/cod-linux-x86_64.tar.xz
          (cd candidate-artifacts && sha256sum cod-linux-x86_64.tar.xz > cod-linux-x86_64.tar.xz.sha256)
          cp candidate-package/cod/cod-commit.txt candidate-package/cod/cod-tree.txt candidate-artifacts/

      - name: Upload the tested Linux package
        if: needs.build.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cod-linux-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-artifacts
          retention-days: 14
          if-no-files-found: error
