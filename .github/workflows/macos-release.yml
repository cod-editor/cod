          repo = make_repo(data, "agent-safety-notes", {"README.txt": "Working close observation.\n"})
          control = data / "advance-to-permission"
          script = data / "agent.json"
          script.write_text(json.dumps({"session_ids": ["mac-safety-session"], "turns": [{"steps": [
              {"chunk": "Reviewing the release notes."}, {"wait": str(control)},
              {"end": "end_turn"}]}]}))
          settings = cod_settings()
          settings["theme"] = "One Dark"
          settings["agent_servers"] = {"claude-acp": fake_agent_settings(script, log=output / "fake-agent.log")}
          (data / "config").mkdir()
          (data / "config/settings.json").write_text(json.dumps(settings))
          socket = Path(tempfile.mkdtemp(prefix="cod-rem-", dir="/tmp")) / "d.sock"
          subprocess.run(["open", "-n", "--env", f"COD_PREVIEW_DIR={data}", "--env",
