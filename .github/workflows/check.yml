name: Check
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit

  services:
    name: Service tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Install graphical test dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb xdotool
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: xvfb-run -a node tests/support/electron/check-sandbox.mjs
      - run: xvfb-run -a node tests/support/electron/run-services.mjs

  electron:
    name: Electron shard ${{ matrix.shard }}/3
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Install graphical test dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb xdotool
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run build
      - run: xvfb-run -a node tests/support/electron/check-sandbox.mjs
      - run: xvfb-run -a npm run test:e2e -- --shard=${{ matrix.shard }}/3 --workers=1

  e2e:
    # Keep the existing branch-protection context. Skipped or cancelled work fails
    # this gate just like a failed shard; every test partition remains required.
    if: ${{ always() }}
    needs: [checks, services, electron]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check and test partition
        env:
          FAST_RESULT: ${{ needs.checks.result }}
          SERVICE_RESULT: ${{ needs.services.result }}
          ELECTRON_RESULT: ${{ needs.electron.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$SERVICE_RESULT" = success
          test "$ELECTRON_RESULT" = success
