name: macOS preview
on:
  push:
    tags: ["v*-preview.*"]
  pull_request:
    paths:
      - ".github/workflows/macos-preview.yml"
      - "scripts/package.mjs"
      - "scripts/macos-preview.sh"
      - "tests/support/electron/check-package.mjs"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    name: Verify Apple Silicon preview
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm run prepare:bitwarden
      - id: package
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-preview.0' }}
        run: |
          filename=$(scripts/macos-preview.sh "$RELEASE_VERSION")
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-arm64-preview
          path: release/${{ steps.package.outputs.filename }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish verified preview
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: macos-arm64-preview
      - name: Require a checked master revision and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
          DMG: ${{ needs.package.outputs.filename }}
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.(0|[1-9][0-9]*)$ ]]
          [[ "$DMG" == "Cod-${VERSION_TAG#v}-macOS-arm64.dmg" ]]
          revision=$(git rev-parse "refs/tags/${VERSION_TAG}^{commit}")
          git merge-base --is-ancestor "$revision" origin/master
          gh api "repos/${GITHUB_REPOSITORY}/commits/${revision}/check-runs?check_name=e2e&filter=latest" \
            --jq '.check_runs | any(.app.slug == "github-actions" and .status == "completed" and .conclusion == "success")' | grep -Fx true
          gh release create "$VERSION_TAG" "$DMG" --verify-tag --prerelease \
            --title "Cod ${VERSION_TAG#v} (macOS preview)" \
            --notes "Apple Silicon preview with an ad-hoc signature. This build is not notarized and does not support in-app updates."
