<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' crx: data:; frame-src cod-preview:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cod</title>
    <link rel="stylesheet" href="./scrollbars.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./xterm.css" />
  </head>
  <body>
    <header class="app-header">
      <div id="visibility-controls" aria-label="Navigation panels"></div>
      <div class="titlebar-center">
        <button
          id="workspace-selector"
          aria-label="Switch workspace"
          type="button"
        >
          <span id="workspace-name">Cod</span>
        </button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="pane-visibility" aria-label="Content panes"></div>
    </header>
    <main class="shell">
      <aside class="sidebar" aria-label="Workspace panel">
        <div
          id="workspace-tree"
          class="workspace-tree"
          role="tree"
          aria-label="Workspaces"
        ></div>
      </aside>
      <aside
        id="project-panel"
        class="project-panel"
        aria-label="Files"
      ></aside>
      <section class="workspace" aria-label="Current workspace">
        <div id="panes" class="panes"></div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
